name: Deploy Estim8r to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write

concurrency:
  group: pages
  # Do not cancel an in-flight Pages deploy. Mid-deploy cancels leave
  # updating_pages wedged until deploy-pages@v4 hits Timeout reached, aborting!
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Takeoff upgrade categories
        run: node src/domain/takeoff/takeoffUpgrade.test.js
      - name: Lint
        run: npm run lint
      - name: Typecheck diagnostics
        continue-on-error: true
        run: npm run typecheck
      - name: Security audit diagnostics
        continue-on-error: true
        run: npm audit --audit-level=moderate
      - name: Write build version
        run: |
          printf '{"sha":"%s","builtAt":"%s"}\n' "$GITHUB_SHA" "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" > public/build-version.json
      - name: Build
        run: npm run build
        env:
          VITE_APP_BUILD_SHA: ${{ github.sha }}
          VITE_APP_NAME: Estim8r
          VITE_APP_URL: https://estim8r.currentflowconsulting.org
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_BUILDR_URL: ${{ secrets.VITE_BUILDR_URL }}
          VITE_BUILDR_API_URL: ${{ secrets.VITE_BUILDR_API_URL }}
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - name: Cancel a stuck Pages deployment
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          now=$(date -u +%s)
          ids=$(gh api "repos/${GITHUB_REPOSITORY}/deployments?environment=github-pages&per_page=15" --jq '.[].id')
          for id in $ids; do
            created=$(gh api "repos/${GITHUB_REPOSITORY}/deployments/${id}" --jq '.created_at')
            sha=$(gh api "repos/${GITHUB_REPOSITORY}/deployments/${id}" --jq '.sha')
            state=$(gh api "repos/${GITHUB_REPOSITORY}/deployments/${id}/statuses" --jq '.[0].state // "unknown"')
            created_s=$(date -u -d "$created" +%s)
            age=$((now - created_s))
            echo "deployment ${id} sha=${sha} state=${state} age=${age}s"
            if [ "$state" = "in_progress" ] && [ "$age" -gt 90 ]; then
              echo "Canceling stuck Pages deployment ${sha}"
              gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/deployments/${sha}/cancel" || true
            fi
          done
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # 15 minutes. The default 10m abort left SHA b56c11b stuck on updating_pages.
          timeout: 900000
          error_count: 20
          reporting_interval: 8000
      - name: Cancel the timed-out Pages attempt
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/deployments/${GITHUB_SHA}/cancel" || true
      - name: Retry Pages deploy after a timeout
        if: failure()
        id: deployment_retry
        uses: actions/deploy-pages@v4
        with:
          timeout: 900000
          error_count: 20
          reporting_interval: 8000
