name: Dual pricing validation
on:
  pull_request:
    paths:
      - 'src/domain/estimate/liveSupplierCatalog.js'
      - 'src/components/estimate/EstimateLineCard.jsx'
      - 'tests/dualSupplierPricing.test.js'
      - '.github/workflows/dual-pricing-validation.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
