<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1e40af" />
    <meta name="application-name" content="Estim8r" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Estim8r" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="Estim8r — professional electrical estimating with traceable labor, production history, and estimator-controlled adjustments." />
    <title>Estim8r — Electrical Estimating</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        var redirect = sessionStorage.getItem("estim8r_redirect");
        if (redirect) {
          sessionStorage.removeItem("estim8r_redirect");
          if (redirect !== window.location.pathname + window.location.search + window.location.hash) {
            history.replaceState(null, "", redirect);
          }
        }
        var currentSha = "%ESTIM8R_BUILD_SHA%";
        window.__ESTIM8R_BUILD_SHA__ = currentSha;
        function showUpdatePopup(nextSha) {
          var existing = document.getElementById("estim8r-update-popup");
          if (existing) existing.remove();
          var overlay = document.createElement("div");
          overlay.id = "estim8r-update-popup";
          overlay.setAttribute("role", "dialog");
          overlay.setAttribute("aria-modal", "true");
          overlay.setAttribute("aria-labelledby", "estim8r-boot-update-title");
          overlay.style.cssText = "position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(15,23,42,.5);font-family:ui-sans-serif,system-ui,sans-serif;";
          overlay.innerHTML = '<div style="width:100%;max-width:28rem;border-radius:16px;background:#fff;box-shadow:0 25px 50px rgba(0,0,0,.25);padding:20px;color:#0f172a;">'
            + '<p id="estim8r-boot-update-title" style="margin:0;font-size:16px;font-weight:700;">Update available</p>'
            + '<p style="margin:8px 0 0;font-size:14px;color:#475569;">A newer version of Estim8r is ready. Update now to load the latest takeoff tools and fixes.</p>'
            + '<button type="button" id="estim8r-boot-update-btn" style="margin-top:16px;width:100%;border:0;border-radius:8px;background:#2563eb;color:#fff;font-size:14px;font-weight:700;padding:10px 12px;cursor:pointer;">Update now</button>'
            + '</div>';
          document.body.appendChild(overlay);
          document.getElementById("estim8r-boot-update-btn").onclick = function () {
            clearStaleClient().finally(function () {
              var url = new URL(window.location.href);
              url.searchParams.set("t", String(Date.now()));
              if (nextSha) url.searchParams.set("build", nextSha);
              window.location.replace(url.toString());
            });
          };
        }
        function clearStaleClient() {
          var jobs = [];
          try {
            if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
              jobs.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(regs.map(function (reg) { return reg.unregister().catch(function () { return false; }); }));
              }));
            }
          } catch (e) { /* leftover workers */ }
          try {
            if ("caches" in window) {
              jobs.push(caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (key) { return caches.delete(key).catch(function () { return false; }); }));
              }));
            }
          } catch (e) { /* leftover Cache API */ }
          return Promise.race([
            Promise.all(jobs).catch(function () {}),
            new Promise(function (resolve) { setTimeout(resolve, 1500); }),
          ]);
        }
        function fetchWithTimeout(url, options, timeoutMs) {
          var controller = typeof AbortController !== "undefined" ? new AbortController() : null;
          var timer = setTimeout(function () { if (controller) controller.abort(); }, timeoutMs || 2000);
          var opts = options || {};
          if (controller) opts.signal = controller.signal;
          return fetch(url, opts).finally(function () { clearTimeout(timer); });
        }
        function readRemoteSha() {
          var bust = "t=" + Date.now() + "&n=" + Math.random().toString(36).slice(2);
          var urls = ["/build-version.json?" + bust, window.location.origin + "/build-version.json?" + bust + "&abs=1"];
          function once(url) {
            var opts = { cache: "reload", headers: { "Cache-Control": "no-cache", Pragma: "no-cache" } };
            return fetchWithTimeout(url, opts, 2000).catch(function () {
              return fetchWithTimeout(url, { cache: "no-store" }, 2000);
            }).then(function (response) { return response && response.ok ? response.json() : null; })
              .then(function (next) { return next && next.sha ? String(next.sha) : ""; })
              .catch(function () { return ""; });
          }
          return once(urls[0]).then(function (sha) {
            if (sha) return sha;
            return once(urls[1]).then(function (retrySha) {
              if (retrySha) return retrySha;
              return once(urls[0] + "&retry=1");
            });
          });
        }
        if (!currentSha || currentSha === "local" || currentSha.indexOf("%ESTIM8R") === 0) return;
        clearStaleClient().then(function () { return readRemoteSha(); }).then(function (remoteSha) {
          if (remoteSha && remoteSha !== currentSha) showUpdatePopup(remoteSha);
        }).catch(function () {});
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
