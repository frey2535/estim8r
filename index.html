<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1e40af" />
    <meta name="application-name" content="Estim8r" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Estim8r" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="Estim8r — professional electrical estimating with traceable labor, production history, and estimator-controlled adjustments." />
    <title>Estim8r — Electrical Estimating</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        var redirect = sessionStorage.getItem("estim8r_redirect");
        if (redirect) {
          sessionStorage.removeItem("estim8r_redirect");
          if (redirect !== window.location.pathname + window.location.search + window.location.hash) {
            history.replaceState(null, "", redirect);
          }
        }
        var currentSha = "%ESTIM8R_BUILD_SHA%";
        window.__ESTIM8R_BUILD_SHA__ = currentSha;
        if (!currentSha || currentSha === "local" || currentSha.indexOf("%ESTIM8R") === 0) return;
        var reloadKey = "estim8r_boot_reload_" + currentSha;
        fetch("/build-version.json?t=" + Date.now(), { cache: "no-store" })
          .then(function (response) { return response.ok ? response.json() : null; })
          .then(function (next) {
            if (!next || !next.sha || next.sha === currentSha) return;
            if (sessionStorage.getItem(reloadKey) === next.sha) return;
            sessionStorage.setItem(reloadKey, next.sha);
            var url = new URL(window.location.href);
            url.searchParams.set("t", String(Date.now()));
            url.searchParams.set("build", next.sha);
            window.location.replace(url.toString());
          })
          .catch(function () {});
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
